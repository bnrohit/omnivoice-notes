name: Apply OmniVoice v2.1

on:
  push:
    branches:
      - feature/v2-advanced
    paths:
      - 'patches/v21-trigger.txt'

permissions:
  contents: write

jobs:
  apply-v21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2-advanced
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply tested v2.1 patches
        shell: bash
        run: |
          shopt -s nullglob
          patches=(patches/v21-*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo 'No v2.1 patches remain to apply.'
            exit 0
          fi

          cat "${patches[@]}" > /tmp/omnivoice-v21.patch
          git apply --check /tmp/omnivoice-v21.patch
          git apply /tmp/omnivoice-v21.patch

          npm run check

          rm -- "${patches[@]}"
          rm -f -- patches/v21-trigger.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            server.mjs \
            package.json \
            public/index.html \
            public/app-shell.js \
            public/app-recording.js \
            public/app-library.js \
            public/app-utils.js \
            public/app-intelligence.js \
            public/intelligence.css \
            public/sw.js
          git add -u -- patches

          git diff --cached --check
          git commit -m 'Build OmniVoice Notes v2.1 intelligence layer'
          git push origin HEAD:feature/v2-advanced
